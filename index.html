<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LD60 - Scrapbound Robot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      font-family: 'Courier New', Courier, monospace;
      cursor: url('./assets/sprites/ui/cursor.png') 0 0, auto;
    }
    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      cursor: url('./assets/sprites/ui/cursor.png') 0 0, auto;
    }
    canvas {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      /* Четкое масштабирование пиксель-арта без сглаживания и размытия */
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: url('./assets/sprites/ui/cursor.png') 0 0, auto;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
